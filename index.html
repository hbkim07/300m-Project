<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3년 3억 달성 마스터 대시보드 💜</title>
    <style>
        :root {
            --primary-purple: #8B5CF6; 
            --light-lavender: #DDD6FE; 
            --bg-color: #F8FAFC;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center;
        }

        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.85); z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--light-lavender); border-top: 5px solid var(--primary-purple); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #errorBox { display: none; background-color: #FEE2E2; border: 1px solid #EF4444; color: #991B1B; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.4; }

        .dashboard { width: 100%; max-width: 1000px; display: grid; gap: 20px; }
        .card { background-color: var(--white); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

        .goal-section { text-align: center; }
        .goal-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; }
        .goal-amount { font-size: 2.5rem; color: var(--primary-purple); font-weight: 800; margin-bottom: 20px; }
        .progress-container { width: 100%; background-color: var(--light-lavender); border-radius: 12px; height: 24px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar { height: 100%; background-color: var(--primary-purple); width: 0%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-text { font-size: 0.9rem; color: var(--text-sub); display: flex; justify-content: space-between; }

        .filter-bar { display: flex; gap: 30px; flex-wrap: nowrap; align-items: center; justify-content: flex-start; background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%); border: 1px solid var(--light-lavender); }
        .filter-group { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .filter-title { font-weight: bold; color: #6D28D9; font-size: 1rem; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .select-month { padding: 10px 16px; border: 1px solid var(--light-lavender); border-radius: 8px; font-size: 0.95rem; font-weight: bold; color: #4C1D95; outline: none; background: white; cursor: pointer; min-width: 160px; }

        .middle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-form { display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; gap: 10px; align-items: center; }
        input, select { padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 1rem; outline: none; width: 100%; box-sizing: border-box;}
        input:focus, select:focus { border-color: var(--primary-purple); }
        input:disabled { background-color: #F1F5F9; color: #94A3B8; }
        
        .checkbox-group { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--text-sub); min-width: 120px; }
        .checkbox-group input { width: auto; margin: 0; cursor: pointer; }

        button { background-color: var(--primary-purple); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #7C3AED; }
        button:disabled { background-color: var(--text-sub); cursor: not-allowed; }

        .summary-box { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #E2E8F0; }
        .summary-box:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .summary-title { color: var(--text-sub); font-size: 0.95rem; }
        .summary-value { font-size: 1.3rem; font-weight: bold; }
        .text-purple { color: var(--primary-purple); }

        .chart-container { position: relative; height: 250px; width: 100%; }
        .trend-container { position: relative; height: 280px; width: 100%; }
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        
        /* 테이블 헤더 인터랙티브 스타일 최적화 */
        th { color: var(--text-sub); font-weight: bold; user-select: none; white-space: nowrap; padding: 12px; border-bottom: 1px solid #E2E8F0; text-align: left; }
        th.sortable:hover { background-color: #F1F5F9; color: var(--primary-purple); }
        .sort-indicator { display: inline-block; width: 12px; margin-left: 4px; color: var(--primary-purple); font-size: 0.8rem; }
        
        td { text-align: left; padding: 12px; border-bottom: 1px solid #E2E8F0; }
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .tag-income { background-color: var(--light-lavender); color: var(--primary-purple); }
        .tag-expense { background-color: #F1F5F9; color: var(--text-sub); }
        .tag-who { background-color: #FEF3C7; color: #B45309; } 

        @media (max-width: 768px) { .middle-grid { grid-template-columns: 1fr; } .filter-bar { flex-direction: column; align-items: flex-start; gap: 12px; flex-wrap: wrap; } }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <h3 id="loadingText" style="color: var(--primary-purple);">구글 시트와 연결 중입니다...</h3>
    </div>

    <div class="dashboard">
        <div id="errorBox"></div>

        <div class="card goal-section">
            <div class="goal-title">🎯 3년 3억 만들기 프로젝트</div>
            <div class="goal-amount" id="currentSaved">현재 0원 모았어요!</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="progressText">달성률 0%</span>
                <span>목표: 300,000,000원</span>
            </div>
        </div>

        <div class="card filter-bar">
            <div class="filter-group">
                <div class="filter-title">📅 조회 기간</div>
                <select id="monthFilter" class="select-month"></select>
            </div>
            <div class="filter-group">
                <div class="filter-title">👤 담당자 필터</div>
                <select id="whoFilter" class="select-month">
                    <option value="all">전체 담당자 보기</option>
                    <option value="별이">별이</option>
                    <option value="돌이">돌이</option>
                    <option value="공용">공용</option>
                </select>
            </div>
        </div>

        <div class="middle-grid">
            <div class="card">
                <h2>✍️ 빠른 내역 입력</h2>
                <form class="input-form" id="recordForm">
                    <div class="input-group">
                        <select id="type" style="width: 25%;">
                            <option value="지출">지출</option>
                            <option value="수입">수입</option>
                        </select>
                        <select id="who" style="width: 25%;">
                            <option value="별이">별이</option>
                            <option value="돌이">돌이</option>
                            <option value="공용">공용</option>
                        </select>
                        <input type="date" id="date" style="width: 50%;" required>
                    </div>
                    
                    <div class="input-group" style="justify-content: flex-end;">
                        <label class="checkbox-group">
                            <input type="checkbox" id="isBaseAsset"> 📌 기초자산 (날짜제외)
                        </label>
                    </div>

                    <div class="input-group">
                        <select id="category" style="width: 40%;">
                            <option value="식비">식비</option>
                            <option value="주거비">주거/통신</option>
                            <option value="교통비">교통/차량</option>
                            <option value="쇼핑">쇼핑/미용</option>
                            <option value="저축">저축/투자</option>
                            <option value="급여">급여/부수입</option>
                            <option value="주식">주식</option>
                            <option value="대출">대출</option>
                            <option value="보증금">보증금</option>
                            <option value="현금">현금</option>
                            <option value="기타">기타</option>
                        </select>
                        <input type="number" id="amount" placeholder="금액 입력 (원)" required>
                    </div>
                    <input type="text" id="memo" placeholder="내용 (예: CMA 통장 잔액)" required>
                    <button type="submit" id="submitBtn">내역 구글 시트에 추가하기</button>
                </form>
            </div>

            <div class="card">
                <h2>📊 <span id="selectedMonthText"></span> <span id="selectedWhoText"></span> 소비 요약</h2>
                <div class="summary-box">
                    <div class="summary-title">선택 조건 총 수입</div>
                    <div class="summary-value text-purple" id="monthIncome">+ 0원</div>
                </div>
                <div class="summary-box">
                    <div class="summary-title">선택 조건 총 지출</div>
                    <div class="summary-value" id="monthExpense">- 0원</div>
                </div>
                <div class="summary-box">
                    <div class="summary-title">가용 순저축액</div>
                    <div class="summary-value text-purple" id="monthSaved">0원</div>
                </div>
            </div>
        </div>

        <div class="middle-grid">
            <div class="card">
                <h2>🍕 카테고리별 비중 (% 및 라벨 표기)</h2>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h2>👤 지출 담당 비율</h2>
                <div class="chart-container">
                    <canvas id="whoChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📈 월간 지출 변화 트렌드 (최근 흐름 분석)</h2>
            <div class="trend-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>📝 거래 상세 내역 <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-sub); margin-left: 8px;">* 열 제목을 클릭하면 정렬 방향이 변경됩니다.</span></h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="sortable" onclick="toggleSort('date')" style="cursor: pointer;">날짜<span id="indicator_date" class="sort-indicator"></span></th>
                            <th class="sortable" onclick="toggleSort('type')" style="cursor: pointer;">분류<span id="indicator_type" class="sort-indicator"></span></th>
                            <th class="sortable" onclick="toggleSort('who')" style="cursor: pointer;">누구<span id="indicator_who" class="sort-indicator"></span></th>
                            <th class="sortable" onclick="toggleSort('category')" style="cursor: pointer;">카테고리<span id="indicator_category" class="sort-indicator"></span></th>
                            <th class="sortable" onclick="toggleSort('memo')" style="cursor: pointer;">내용<span id="indicator_memo" class="sort-indicator"></span></th>
                            <th class="sortable" onclick="toggleSort('amount')" style="text-align: right; cursor: pointer;">금액<span id="indicator_amount" class="sort-indicator"></span></th>
                        </tr>
                    </thead>
                    <tbody id="recordBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8aYw_h3VdJCVD2UXve99kFWzrvg8URSo413BSBiR5P8Ca6gkJaZP1WD9aF4jkHAEwOg/exec";
        const GOAL_AMOUNT = 300000000; 

        const today = new Date();
        document.getElementById('date').valueAsDate = today;

        // 전역 설정 상태 변수함
        let globalRawData = []; 
        let catChartInstance = null;
        let whoChartInstance = null;
        let trendChartInstance = null;

        // ✨ [정렬 기준 상태 기본 세팅] 초반 기본값은 날짜 내림차순(최신순)
        let currentSortKey = 'date';
        let currentSortOrder = 'desc'; 

        document.getElementById('isBaseAsset').addEventListener('change', function(e) {
            const dateInput = document.getElementById('date');
            if(e.target.checked) {
                dateInput.value = ''; dateInput.disabled = true; dateInput.required = false;
            } else {
                dateInput.valueAsDate = new Date(); dateInput.disabled = false; dateInput.required = true;
            }
        });

        document.getElementById('monthFilter').addEventListener('change', () => renderDashboardByFilter(globalRawData));
        document.getElementById('whoFilter').addEventListener('change', () => renderDashboardByFilter(globalRawData));

        // ✨ [클릭 시 정렬 키 전환 함수]
        function toggleSort(key) {
            if (currentSortKey === key) {
                // 같은 열을 한 번 더 누르면 내림차순 ↔ 오름차순 토글
                currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            } else {
                // 새로운 열을 누르면 내림차순으로 우선 셋팅
                currentSortKey = key;
                currentSortOrder = 'desc';
            }
            renderDashboardByFilter(globalRawData);
        }

        async function loadData() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('errorBox').style.display = 'none';
            try {
                const response = await fetch(SCRIPT_URL);
                globalRawData = await response.json();
                
                setupMonthFilter(globalRawData);
                renderDashboardByFilter(globalRawData);
            } catch (error) {
                showError("구글 시트 연동 오류: 데이터를 가져오지 못했습니다. 스크립트 배포 및 네트워크 환경을 확인해 주세요. (상세: " + error.message + ")");
            }
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showError(msg) {
            const errBox = document.getElementById('errorBox');
            errBox.innerText = msg;
            errBox.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function cleanDate(dateInput) {
            let dateStr = String(dateInput || '').trim();
            if (!dateStr || dateStr === '기초자산' || dateStr === '-') return '기초자산';
            if (dateStr.includes('GMT') || (isNaN(dateStr) && !isNaN(Date.parse(dateStr)))) {
                try {
                    const d = new Date(dateStr);
                    const yyyy = d.getFullYear();
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    return `${yyyy}-${mm}-${dd}`;
                } catch(e) {}
            }
            dateStr = dateStr.replace(/[\.\/]/g, '-');
            const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) return `${match[1]}-${match[2]}-${match[3]}`;
            return dateStr;
        }

        function setupMonthFilter(data) {
            const filterSelect = document.getElementById('monthFilter');
            const currentSelectedValue = filterSelect.value; 
            
            let monthsSet = new Set();
            const currentMonthStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
            monthsSet.add(currentMonthStr);

            if (Array.isArray(data)) {
                data.forEach(row => {
                    let dateStr = cleanDate(row.date);
                    if (dateStr && dateStr !== '기초자산' && !dateStr.startsWith('1970')) {
                        const match = dateStr.substring(0, 7);
                        if (match.match(/^\d{4}-\d{2}$/)) {
                            monthsSet.add(match);
                        }
                    }
                });
            }

            const sortedMonths = Array.from(monthsSet).sort().reverse();
            filterSelect.innerHTML = '<option value="all">전체 기간 보기</option>';
            sortedMonths.forEach(m => {
                filterSelect.innerHTML += `<option value="${m}">${m.substring(0,4)}년 ${m.substring(5,7)}월</option>`;
            });

            if (currentSelectedValue) {
                filterSelect.value = currentSelectedValue;
            } else {
                filterSelect.value = currentMonthStr; 
            }
        }

        function renderDashboardByFilter(data) {
            try {
                const selectedMonth = document.getElementById('monthFilter').value;
                const selectedWho = document.getElementById('whoFilter').value;

                document.getElementById('selectedMonthText').innerText = selectedMonth === 'all' ? '전체 기간' : selectedMonth.substring(5,7) + '월';
                document.getElementById('selectedWhoText').innerText = selectedWho === 'all' ? '전체' : selectedWho;

                // 정렬 화살표 지표등 실시간 갱신
                const keys = ['date', 'type', 'who', 'category', 'memo', 'amount'];
                keys.forEach(k => {
                    const indicator = document.getElementById('indicator_' + k);
                    if (indicator) {
                        if (k === currentSortKey) {
                            indicator.innerText = currentSortOrder === 'desc' ? ' ▼' : ' ▲';
                        } else {
                            indicator.innerText = '';
                        }
                    }
                });

                let totalSaved = 0; 
                let monthIncome = 0;
                let monthExpense = 0;
                let categoryExpenses = {};
                let whoExpenses = { "별이": 0, "돌이": 0, "공용": 0 };
                let trendDataMap = {}; 

                const tbody = document.getElementById('recordBody');
                tbody.innerHTML = ''; 

                const availableMonths = [];
                const filterOptions = document.getElementById('monthFilter').options;
                for(let i=0; i<filterOptions.length; i++) {
                    if(filterOptions[i].value !== 'all') availableMonths.push(filterOptions[i].value);
                }
                availableMonths.sort().forEach(m => trendDataMap[m] = 0);

                // 정렬을 입히기 위한 필터링 데이터 보관 컨테이너
                let filteredTableRows = [];

                if (Array.isArray(data)) {
                    data.forEach(row => {
                        const cleanAmountStr = String(row.amount || '').replace(/[^0-9]/g, '');
                        const amount = Math.abs(parseInt(cleanAmountStr)) || 0;

                        const isIncome = row.type === '수입';
                        const isExpense = row.type === '지출';
                        
                        let dateStr = cleanDate(row.date);
                        const isBaseAssetRow = (dateStr === '기초자산' || dateStr.startsWith('1970'));

                        const val1 = String(row.category || '').trim();
                        const val2 = String(row.who || '').trim();
                        let realWho = '미지정'; let realCategory = '기타';

                        if (['별이', '돌이', '공용'].includes(val1)) { realWho = val1; realCategory = val2; }
                        else if (['별이', '돌이', '공용'].includes(val2)) { realWho = val2; realCategory = val1; }
                        else { realWho = val1; realCategory = val2; }

                        if (isIncome) totalSaved += amount;
                        else totalSaved -= amount;

                        if (isExpense && !isBaseAssetRow) {
                            if (selectedWho === 'all' || realWho === selectedWho) {
                                const m = dateStr.substring(0, 7);
                                if (trendDataMap[m] !== undefined) trendDataMap[m] += amount;
                            }
                        }

                        let isWhoMatch = (selectedWho === 'all' || realWho === selectedWho);
                        let includeInChart = false;

                        if (selectedMonth === 'all') {
                            includeInChart = isWhoMatch; 
                        } else if (!isBaseAssetRow && dateStr.startsWith(selectedMonth)) {
                            includeInChart = isWhoMatch; 
                        }

                        if (includeInChart) {
                            if (isIncome) {
                                if (!isBaseAssetRow) monthIncome += amount;
                            } else if (isExpense) {
                                if (!isBaseAssetRow || selectedMonth === 'all') {
                                    monthExpense += amount;
                                    if (!categoryExpenses[realCategory]) categoryExpenses[realCategory] = 0;
                                    categoryExpenses[realCategory] += amount;

                                    if (whoExpenses[realWho] !== undefined) {
                                        whoExpenses[realWho] += amount;
                                    }
                                }
                            }
                        }

                        // 테이블 조건에 매칭되는 행만 임시 컨테이너에 먼저 푸시 (정렬 전처리)
                        let showInTable = false;
                        if (selectedMonth === 'all' || isBaseAssetRow) {
                            showInTable = isWhoMatch || isBaseAssetRow; 
                        } else if (dateStr.startsWith(selectedMonth)) {
                            showInTable = isWhoMatch; 
                        }

                        if (showInTable) {
                            filteredTableRows.push({
                                date: dateStr,
                                isBase: isBaseAssetRow,
                                type: row.type,
                                who: realWho,
                                category: realCategory,
                                memo: row.memo || '-',
                                amount: amount,
                                displayDate: isBaseAssetRow ? '-' : dateStr
                            });
                        }
                    });

                    // ✨ [V20 다차원 열 정렬 알고리즘 작동] ✨
                    filteredTableRows.sort((a, b) => {
                        // 날짜가 없는 기초자산 데이터는 언제나 리스트 하단에 단단히 고정 배치!
                        if (a.isBase && !b.isBase) return 1;
                        if (!a.isBase && b.isBase) return -1;
                        if (a.isBase && b.isBase) return 0; 
                        
                        let valA = a[currentSortKey];
                        let valB = b[currentSortKey];

                        // 문자형 데이터 정렬 조립 (날짜, 카테고리 등)
                        if (typeof valA === 'string') {
                            return currentSortOrder === 'desc' ? valB.localeCompare(valA) : valA.localeCompare(valB);
                        } else {
                            // 숫자형 데이터 정렬 조립 (금액)
                            return currentSortOrder === 'desc' ? valB - valA : valA - valB;
                        }
                    });

                    // 정렬 처리가 끝난 컨테이너 데이터를 화면 돔(DOM) 구조에 렌더링
                    filteredTableRows.forEach(item => {
                        const isIncome = item.type === '수입';
                        const typeClass = isIncome ? 'tag-income' : 'tag-expense';
                        const prefix = isIncome ? '+' : '-';
                        const colorStyle = isIncome ? 'color: var(--primary-purple);' : '';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${item.displayDate}</td>
                            <td><span class="tag ${typeClass}">${item.type}</span></td>
                            <td><span class="tag tag-who">${item.who}</span></td> 
                            <td>${item.category}</td>
                            <td>${item.memo}</td>
                            <td style="text-align: right; ${colorStyle}">${prefix}${item.amount.toLocaleString()}원</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                let progressPercent = (totalSaved / GOAL_AMOUNT) * 100;
                if (progressPercent < 0) progressPercent = 0; 
                document.getElementById('currentSaved').innerText = `현재 ${totalSaved.toLocaleString()}원 모았어요!`;
                setTimeout(() => {
                    document.getElementById('progressBar').style.width = Math.min(progressPercent, 100) + '%';
                }, 100);
                document.getElementById('progressText').innerText = `달성률 ${progressPercent.toFixed(1)}%`;

                if (selectedMonth === 'all' && selectedWho === 'all') {
                    document.getElementById('monthIncome').innerText = '전체보기 중';
                    document.getElementById('monthExpense').innerText = '전체보기 중';
                    document.getElementById('monthSaved').innerText = totalSaved.toLocaleString() + '원';
                } else {
                    document.getElementById('monthIncome').innerText = '+' + monthIncome.toLocaleString() + '원';
                    document.getElementById('monthExpense').innerText = '-' + monthExpense.toLocaleString() + '원';
                    document.getElementById('monthSaved').innerText = (monthIncome - monthExpense).toLocaleString() + '원';
                }

                renderCharts(categoryExpenses, whoExpenses, trendDataMap);
            } catch (err) {
                showError("렌더링 연산 스크립트 에러 발생: " + err.message);
            }
        }

        function renderCharts(catData, whoData, trendData) {
            if (typeof Chart === 'undefined') return;

            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            const ctxWho = document.getElementById('whoChart').getContext('2d');
            const ctxTrend = document.getElementById('trendChart').getContext('2d');

            if (catChartInstance) catChartInstance.destroy();
            if (whoChartInstance) whoChartInstance.destroy();
            if (trendChartInstance) trendChartInstance.destroy();

            const palette = ['#8B5CF6', '#A78BFA', '#C4B5FD', '#DDD6FE', '#4C1D95', '#6D28D9', '#E9D5FF'];

            catChartInstance = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catData),
                    datasets: [{ data: Object.values(catData), backgroundColor: palette, borderWidth: 2, borderColor: '#ffffff' }]
                },
                plugins: [{
                    id: 'doughnutLabels',
                    afterDatasetsDraw(chart) {
                        const { ctx, data } = chart;
                        ctx.save();
                        ctx.font = 'bold 11px Pretendard, sans-serif'; ctx.fillStyle = '#1E293B';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        
                        const meta = chart.getDatasetMeta(0);
                        const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                        
                        meta.data.forEach((arc, index) => {
                            const value = data.datasets[0].data[index];
                            if (value === 0 || total === 0) return;
                            const percentage = ((value / total) * 100).toFixed(1) + '%';
                            const label = data.labels[index];
                            const angle = arc.startAngle + (arc.endAngle - arc.startAngle) / 2;
                            const radius = arc.innerRadius + (arc.outerRadius - arc.innerRadius) / 2;
                            const x = arc.x + Math.cos(angle) * radius;
                            const y = arc.y + Math.sin(angle) * radius;
                            if ((value / total) * 100 > 3) {
                                ctx.fillText(label, x, y - 6);
                                ctx.fillText(percentage, x, y + 6);
                            }
                        });
                        ctx.restore();
                    }
                }],
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', display: true } } }
            });

            whoChartInstance = new Chart(ctxWho, {
                type: 'bar',
                data: {
                    labels: Object.keys(whoData),
                    datasets: [{ label: '지출 금액', data: Object.values(whoData), backgroundColor: '#8B5CF6', borderRadius: 8, barThickness: 40 }]
                },
                plugins: [{
                    id: 'topLabels',
                    afterDatasetsDraw(chart) {
                        const { ctx, data } = chart;
                        ctx.save();
                        ctx.font = 'bold 12px Pretendard, sans-serif'; ctx.fillStyle = '#1E293B';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        chart.getDatasetMeta(0).data.forEach((bar, index) => {
                            const value = data.datasets[0].data[index] || 0;
                            ctx.fillText(value.toLocaleString() + '원', bar.x, bar.y - 6);
                        });
                        ctx.restore();
                    }
                }],
                options: {
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { grid: { display: false }, border: { display: false } },
                        y: { display: true, beginAtZero: true, grid: { display: false }, ticks: { display: true } } 
                    }
                }
            });

            const trendLabels = Object.keys(trendData).map(m => m.substring(5,7) + '월'); 
            trendChartInstance = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: trendLabels,
                    datasets: [{
                        label: '월간 지출액 총합',
                        data: Object.values(trendData),
                        borderColor: '#8B5CF6',
                        backgroundColor: 'rgba(139, 92, 246, 0.05)',
                        borderWidth: 3,
                        pointBackgroundColor: '#FFFFFF',
                        pointBorderColor: '#8B5CF6',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        fill: true,
                        tension: 0.35 
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false } },
                        y: { display: true, beginAtZero: true, grid: { display: false }, ticks: { callback: function(value) { return value.toLocaleString() + '원'; } } }
                    }
                }
            });
        }

        document.getElementById('recordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = '구글 시트에 저장 중... ⏳';
            submitBtn.disabled = true;

            const isBase = document.getElementById('isBaseAsset').checked;

            const payload = {
                date: isBase ? "기초자산" : document.getElementById('date').value,
                type: document.getElementById('type').value,
                category: document.getElementById('who').value, 
                who: document.getElementById('category').value,
                memo: document.getElementById('memo').value,
                amount: document.getElementById('amount').value.replace(/,/g, '') 
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('memo').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('isBaseAsset').checked = false;
                document.getElementById('date').disabled = false;
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('date').required = true;
                
                await loadData();
            } catch (error) {
                alert('데이터 저장에 실패했습니다: ' + error.message);
            }

            submitBtn.innerText = '내역 구글 시트에 추가하기';
            submitBtn.disabled = false;
        });

        window.onload = loadData;
    </script>
</body>
</html>
